services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lifedashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d lifedashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dashboard:dashboard@postgres:5432/lifedashboard
      SERVER_ENV: development
      HEVY_API_KEY: ${HEVY_API_KEY:-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-http://localhost:8080/api/v1/auth/strava/callback}
      ZENMONEY_TOKEN: ${ZENMONEY_TOKEN:-}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:8000}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-5-20250929}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./migrations:/app/migrations

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
