<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Life Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding:
          calc(2rem + env(safe-area-inset-top))
          1.25rem
          calc(2rem + env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 34%),
          #0f172a;
        color: #f8fafc;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      main {
        width: min(100%, 28rem);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 1.75rem;
        padding: 1.5rem;
        background: rgba(15, 23, 42, 0.88);
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.42);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        line-height: 1.55;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет соединения</h1>
      <p>Life Dashboard установлен как приложение, но сейчас сеть недоступна. Когда интернет вернётся, открой экран ещё раз.</p>
    </main>
  </body>
</html>
