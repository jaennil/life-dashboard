apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. Two backends must never overlap:
  # the new one applies migrations at startup while the old one is still serving
  # the previous schema, and Telegram rejects a second getUpdates poller with
  # "terminated by other getUpdates request".
  #
  # The price is real: the old pod is gone before the new image is pulled, and
  # pulling a fresh tag onto the Pi measured at ~3 minutes, so that is the
  # downtime per deploy rather than the few seconds an already-cached image
  # would cost. Accepted for a single-user dashboard; switch back to
  # RollingUpdate with maxUnavailable 0 if that ever stops being true.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      annotations:
        life-dashboard/config-revision: "sealed-config-20260728"
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: ['sh', '-c', 'until nc -z postgres-rw 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: backend
          image: backend
          env:
            - name: SERVER_ENV
              value: production
            - name: HTTPS_PROXY
              value: "http://xray.proxy.svc.cluster.local:1081"
            - name: HTTP_PROXY
              value: "http://xray.proxy.svc.cluster.local:1081"
            # Hosts excluded from the proxy on purpose: all of them answer from
            # this node directly, while the proxy sends them out through whichever
            # foreign exit its balancer happens to pick, which produced
            # intermittent "TLS handshake timeout" failures - first for zenmoney
            # and xiaomi_scale, then four in a row for hevy. FatSecret is here for
            # a second reason: it throttles per account and a stable source
            # address is worth more than a rotating one.
            #
            # Measured from the node against the real API paths, 14.09.2026.
            # Two hosts genuinely need the proxy, for different reasons:
            # api.telegram.org never connects at all - fifteen seconds and a
            # timeout, blocked on the way - while api.notion.com connects in
            # 0.18s and answers 403 with a Cloudflare page even to the real
            # token, because Notion does not serve this country. Everything else
            # answers its own codes directly - todoist 200 with the real token,
            # calendar 401, zepp 401, xiaomi sts 200 - and every hour spent on
            # the proxy is an hour of sharing xray's health: one bad afternoon
            # stalled six connectors at once.
            #
            # dubrovskih.ru is the home domain - vikunja, home assistant and this
            # app itself all answer from this node. The private ranges above do
            # not cover them, because the proxy is chosen by hostname and these
            # resolve to a public address. Left in the proxy, every task dictated
            # into Vikunja travelled out through a foreign exit and back, and died
            # with "EOF" whenever xray hiccuped: nineteen syncs in a row on the
            # fourteenth, and both tasks dictated that afternoon.
            - name: NO_PROXY
              value: "localhost,127.0.0.1,postgres-rw,claude-code-api,192.168.3.4,.svc.cluster.local,.cluster.local,10.0.0.0/8,192.168.0.0/16,dubrovskih.ru,.dubrovskih.ru,api.zenmoney.ru,ru.api.io.mi.com,sts.api.io.mi.com,account.xiaomi.com,api-mifit.zepp.com,api.todoist.com,oauth2.googleapis.com,www.googleapis.com,accounts.google.com,api.aitunnel.ru,api.hevyapp.com,platform.fatsecret.com,authentication.fatsecret.com"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASS)@postgres-rw:5432/lifedashboard?sslmode=disable"
            - name: STRAVA_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/strava/callback
            - name: FATSECRET_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/fatsecret/callback
            - name: GOOGLE_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/google/callback
            - name: UNLEASH_URL
              value: "http://unleash.unleash.svc.cluster.local:4242/api"
            - name: NOTION_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/notion/callback
            - name: TODOIST_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/todoist/callback
            - name: AI_BASE_URL
              value: https://api.aitunnel.ru
            - name: AI_MODEL
              value: deepseek-v4-pro
            # AITunnel forwards reasoning_effort to the model rather than
            # rejecting it, verified against the live API: the same trivial
            # prompt took 2.6s without it and 10.2s with it.
            - name: AI_REASONING_EFFORT
              value: high
            # Turning a dictated phrase into exercises is extraction, not
            # reasoning. Measured on the same phrase against the live API: the
            # checkup model spent 43s and 2.02 RUB, the fast one 0.14 RUB with no
            # thinking tokens and the same answer. Waiting 43 seconds at a machine
            # is what makes the difference matter.
            - name: AI_PARSE_MODEL
              value: deepseek-v4-flash
            - name: AI_PARSE_REASONING_EFFORT
              value: low

          envFrom:
            - secretRef:
                name: app-config
          ports:
            - containerPort: 8080
              name: http
          # The process waits up to three minutes for Postgres before giving up,
          # and liveness would otherwise kill it after about a hundred seconds of
          # that wait. A startup probe suspends liveness until the server answers.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 48
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
