apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: ['sh', '-c', 'until nc -z postgres-rw 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: backend
          image: backend
          env:
            - name: SERVER_ENV
              value: production
            - name: HTTPS_PROXY
              value: "http://xray.proxy.svc.cluster.local:1081"
            - name: HTTP_PROXY
              value: "http://xray.proxy.svc.cluster.local:1081"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,postgres-rw,claude-code-api,.svc.cluster.local,.cluster.local,10.0.0.0/8,192.168.0.0/16"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASS)@postgres-rw:5432/lifedashboard?sslmode=disable"
            - name: STRAVA_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/strava/callback
            - name: FATSECRET_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/fatsecret/callback
            - name: GOOGLE_CLIENT_ID
              value: "1088934787876-e9urhtih3crs40puu7ljvfdiqhdi9lek.apps.googleusercontent.com"
            - name: GOOGLE_CLIENT_SECRET
              value: "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"
            - name: GOOGLE_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/google/callback
            - name: UNLEASH_URL
              value: "http://unleash.unleash.svc.cluster.local:4242/api"
            - name: UNLEASH_API_TOKEN
              value: "default:production.17a398cdf065310266cb7a75945cb7042b4af0760f63df23ef74fb7f"
            - name: NOTION_CLIENT_ID
              value: "337d872b-594c-815a-aff5-0037c968a909"
            - name: NOTION_CLIENT_SECRET
              value: "secret_2uzkS12tU7o0yD6T7zP3FSCyqbTIu8BQgrgKyIIUGUA"
            - name: NOTION_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/notion/callback
            - name: AI_BASE_URL
              value: http://claude-code-api:8000
            - name: AI_MODEL
              value: claude-sonnet-4-5-20250514

          envFrom:
            - secretRef:
                name: app-config
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
