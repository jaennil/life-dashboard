apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      annotations:
        life-dashboard/config-revision: "sealed-config-20260728"
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: ['sh', '-c', 'until nc -z postgres-rw 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: backend
          image: backend
          env:
            - name: SERVER_ENV
              value: production
            - name: HTTPS_PROXY
              value: "http://xray.proxy.svc.cluster.local:1081"
            - name: HTTP_PROXY
              value: "http://xray.proxy.svc.cluster.local:1081"
            # Russian APIs are excluded from the proxy on purpose. They are
            # reachable from this node directly, while the proxy sends them out
            # through whichever foreign exit its balancer happens to pick, which
            # produced intermittent "TLS handshake timeout" failures for the
            # zenmoney and xiaomi_scale syncs. A datacenter exit also looks like
            # fraud to the risk checks these services run.
            - name: NO_PROXY
              value: "localhost,127.0.0.1,postgres-rw,claude-code-api,192.168.3.4,.svc.cluster.local,.cluster.local,10.0.0.0/8,192.168.0.0/16,api.zenmoney.ru,ru.api.io.mi.com,account.xiaomi.com,api.aitunnel.ru"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASS)@postgres-rw:5432/lifedashboard?sslmode=disable"
            - name: STRAVA_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/strava/callback
            - name: FATSECRET_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/fatsecret/callback
            - name: GOOGLE_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/google/callback
            - name: UNLEASH_URL
              value: "http://unleash.unleash.svc.cluster.local:4242/api"
            - name: NOTION_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/notion/callback
            - name: TODOIST_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/todoist/callback
            - name: AI_BASE_URL
              value: https://api.aitunnel.ru
            - name: AI_MODEL
              value: deepseek-v4-pro
            # AITunnel forwards reasoning_effort to the model rather than
            # rejecting it, verified against the live API: the same trivial
            # prompt took 2.6s without it and 10.2s with it.
            - name: AI_REASONING_EFFORT
              value: high

          envFrom:
            - secretRef:
                name: app-config
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
