apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: ['sh', '-c', 'until nc -z postgres-rw 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: backend
          image: backend
          env:
            - name: SERVER_ENV
              value: production
            - name: HTTPS_PROXY
              value: "http://xray.proxy.svc.cluster.local:1081"
            - name: HTTP_PROXY
              value: "http://xray.proxy.svc.cluster.local:1081"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,postgres-rw,claude-code-api,.svc.cluster.local,.cluster.local,10.0.0.0/8,192.168.0.0/16"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASS)@postgres-rw:5432/lifedashboard?sslmode=disable"
            - name: STRAVA_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/strava/callback
            - name: FATSECRET_REDIRECT_URI
              value: https://lifedash.dubrovskih.ru/api/v1/auth/fatsecret/callback
            - name: AI_BASE_URL
              value: http://claude-code-api:8000
            - name: AI_MODEL
              value: claude-sonnet-4-5-20250929
          envFrom:
            - secretRef:
                name: app-config
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
