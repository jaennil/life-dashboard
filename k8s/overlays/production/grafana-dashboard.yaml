apiVersion: v1
kind: ConfigMap
metadata:
  name: life-dashboard-dashboard
  namespace: life-dashboard
  labels:
    grafana_dashboard: "1"
data:
  life-dashboard-observability.json: |
    {
      "title": "Life Dashboard",
      "uid": "life-dashboard",
      "schemaVersion": 39,
      "version": 1,
      "timezone": "browser",
      "refresh": "30s",
      "tags": ["life-dashboard", "backend"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "constant",
            "label": "Namespace",
            "query": "life-dashboard",
            "current": {
              "selected": true,
              "text": "life-dashboard",
              "value": "life-dashboard"
            }
          },
          {
            "name": "job",
            "type": "query",
            "label": "Job",
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "query": "label_values(life_dashboard_http_requests_total{namespace=\"$namespace\"}, job)",
            "refresh": 1,
            "includeAll": false,
            "multi": false,
            "current": {
              "selected": true,
              "text": "backend",
              "value": "backend"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Request Rate (rps)",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(life_dashboard_http_requests_total{namespace=\"$namespace\",job=\"$job\"}[5m]))"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "orientation": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "5xx Rate",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(rate(life_dashboard_http_requests_total{namespace=\"$namespace\",job=\"$job\",status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(life_dashboard_http_requests_total{namespace=\"$namespace\",job=\"$job\"}[5m])), 0.001)"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "orientation": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 Latency",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(life_dashboard_http_request_duration_seconds_bucket{namespace=\"$namespace\",job=\"$job\"}[5m])))"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "orientation": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 2}
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Sync Errors / 24h",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(life_dashboard_sync_runs_total{namespace=\"$namespace\",job=\"$job\",status=\"error\"}[24h]))"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "orientation": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests by Status",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status_code) (rate(life_dashboard_http_requests_total{namespace=\"$namespace\",job=\"$job\"}[5m]))",
              "legendFormat": "{{status_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "p95 Latency by Route",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, route) (rate(life_dashboard_http_request_duration_seconds_bucket{namespace=\"$namespace\",job=\"$job\"}[5m])))",
              "legendFormat": "{{route}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "id": 7,
          "type": "barchart",
          "title": "Sync Runs by Connector (24h)",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (source, status) (increase(life_dashboard_sync_runs_total{namespace=\"$namespace\",job=\"$job\"}[24h]))",
              "legendFormat": "{{source}} {{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          }
        },
        {
          "id": 8,
          "type": "barchart",
          "title": "AI Upstream Outcomes (24h)",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (operation, status) (increase(life_dashboard_ai_upstream_requests_total{namespace=\"$namespace\",job=\"$job\"}[24h]))",
              "legendFormat": "{{operation}} {{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          }
        }
      ]
    }
