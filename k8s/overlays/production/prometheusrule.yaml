apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: life-dashboard-alerts
  namespace: life-dashboard
spec:
  groups:
    - name: life-dashboard.http
      rules:
        - alert: LifeDashboardBackend5xxHigh
          expr: |
            (
              sum(rate(life_dashboard_http_requests_total{namespace="life-dashboard",job="backend",status_code=~"5.."}[5m]))
              /
              clamp_min(sum(rate(life_dashboard_http_requests_total{namespace="life-dashboard",job="backend"}[5m])), 0.001)
            ) > 0.05
            and
            sum(rate(life_dashboard_http_requests_total{namespace="life-dashboard",job="backend"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Life Dashboard backend returns too many 5xx responses
            description: Backend 5xx ratio in namespace {{ $labels.namespace }} has been above 5% for 10 minutes.
        - alert: LifeDashboardBackendLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(life_dashboard_http_request_duration_seconds_bucket{namespace="life-dashboard",job="backend"}[5m])
              )
            ) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Life Dashboard backend p95 latency is high
            description: Backend p95 latency in namespace {{ $labels.namespace }} has been above 2 seconds for 10 minutes.
    - name: life-dashboard.integrations
      rules:
        # A single failed run is normal: connectors talk to consumer APIs over a
        # home connection and the scheduler already retries with backoff. Only a
        # source that keeps failing is worth waking someone up for, and grouping
        # by source puts the culprit in the notification.
        #
        # The prefetch before an AI answer is excluded: it cuts a slow source off
        # after a few seconds on purpose, so its errors say the answer did not
        # wait, not that the integration is broken.
        - alert: LifeDashboardSyncErrors
          expr: sum by (source) (increase(life_dashboard_sync_runs_total{namespace="life-dashboard",job="backend",status="error",trigger!="prefetch"}[1h])) >= 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Life Dashboard sync errors detected ({{ $labels.source }})
            description: Connector {{ $labels.source }} failed {{ $value }} sync runs in the last hour.
        # A section that answers and cannot be stored is the quietest failure of
        # all: the sync reports success and the table simply stays empty, which
        # reads exactly like a device that records nothing. Stress and PAI were
        # fetched on every sync for months and stored never, and no counter here
        # moved. This is that counter.
        - alert: LifeDashboardSyncSectionUnusable
          expr: sum by (source, section) (increase(life_dashboard_sync_section_unusable_total{namespace="life-dashboard",job="backend"}[1h])) >= 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Life Dashboard cannot read a section ({{ $labels.source }}/{{ $labels.section }})
            description: Section {{ $labels.section }} of {{ $labels.source }} returned data that could not be stored {{ $value }} times in the last hour.
        # The failure that actually costs data is silence: a source that keeps
        # trying and never succeeds. That never fired an alert before.
        # Measured against the time of the last success, not against a count of
        # runs. A counter lives in the process: after a deploy it appears already
        # at one, Prometheus never saw the zero before it, and increase() reads
        # zero over any window - so six deploys in a day raised five alerts about
        # connectors that were syncing every hour. The timestamp comes from the
        # database and outlives the pod.
        #
        # Only the sources this app fetches itself. Location, screen time and the
        # health export arrive when the phone sends them, and six quiet hours
        # there is an evening at home, not a broken connector.
        - alert: LifeDashboardSyncStalled
          expr: |
            time() - life_dashboard_sync_last_success_timestamp_seconds{namespace="life-dashboard",job="backend",mode="polled"} > 6 * 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Life Dashboard source is not syncing ({{ $labels.source }})
            description: Connector {{ $labels.source }} has been running without a single successful sync for 6 hours.
    - name: life-dashboard.ai
      rules:
        - alert: LifeDashboardAIUpstreamErrors
          expr: increase(life_dashboard_ai_upstream_requests_total{namespace="life-dashboard",job="backend",status!="success"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Life Dashboard AI upstream errors detected
            description: One or more AI upstream requests failed or returned an invalid response in the last 15 minutes.
