name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-backend:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=backend-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.suffix }}
          provenance: false

  build-frontend:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=frontend-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.suffix }}
          provenance: false

  merge-manifests:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: merge backend manifest
        run: |
          docker manifest create ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}-amd64 \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}-arm64
          docker manifest push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker manifest create ${{ env.BACKEND_IMAGE }}:latest \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}-amd64 \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}-arm64
          docker manifest push ${{ env.BACKEND_IMAGE }}:latest
      - name: merge frontend manifest
        run: |
          docker manifest create ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}-amd64 \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}-arm64
          docker manifest push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker manifest create ${{ env.FRONTEND_IMAGE }}:latest \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}-amd64 \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}-arm64
          docker manifest push ${{ env.FRONTEND_IMAGE }}:latest

  update-manifests:
    needs: merge-manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: install kustomize
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: update image tags
        run: |
          cd k8s/overlays/production
          kustomize edit set image \
            backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "ci: update image tags to ${GITHUB_SHA::7}" || exit 0
          git pull --rebase origin main
          git push
